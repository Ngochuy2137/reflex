[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex"
version = "1.0.0"
description = "Reflex: visually grounded reactive humanoid control (Unitree G1 box catching)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # runs inside the Isaac Sim / Isaac Lab Python; see docs/INSTALL.md

[tool.setuptools.packages.find]
where = ["."]
include = ["reflex*"]
